version: '3.8'

services:
  gokkalkan-api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    container_name: gokkalkan-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
